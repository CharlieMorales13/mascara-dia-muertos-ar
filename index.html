<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#160c1a">
  <title>Calavera de Cempasúchil</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="escenario">
    <video id="video" playsinline muted></video>
    <canvas id="lienzo"></canvas>
  </div>

  <div id="estado">Preparando la ofrenda…</div>

  <div id="gestos">
    <span data-gesto="boca">😮 Pétalos</span>
    <span data-gesto="cejas">🤨 Velas</span>
    <span data-gesto="ojos">😑 Noche</span>
  </div>

  <button id="sonido" aria-label="Activar sonido">🔇 Toca para sonido</button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
